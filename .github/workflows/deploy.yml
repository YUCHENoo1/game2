name: Build and deploy Godot Web

on:
  push:
    branches: [main]
    paths:
      - 'dream-dock-game.zip'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download Godot and Web export template
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o godot.zip
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  godot.zip' | sha256sum -c -
          unzip -q godot.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
          echo "$GITHUB_WORKSPACE" >> "$GITHUB_PATH"
          templates_dir="$HOME/.local/share/godot/export_templates/4.7.2.stable"
          mkdir -p "$templates_dir"
          curl -fsSL https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz -o templates.tpz
          unzip -p templates.tpz templates/version.txt > "$templates_dir/version.txt"
          unzip -p templates.tpz templates/web_nothreads_release.zip > "$templates_dir/web_nothreads_release.zip"
          test -s "$templates_dir/web_nothreads_release.zip"

      - name: Export game for the web
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source site
          unzip -q dream-dock-game.zip -d source
          project_dir="$GITHUB_WORKSPACE/source/dream-dock-game"
          test -f "$project_dir/project.godot"
          cat > "$project_dir/export_presets.cfg" <<'EOF'
          [preset.0]
          name="Web"
          platform="Web"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="web-build/index.html"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false
          script_export_mode=2

          [preset.0.options]
          custom_template/debug=""
          custom_template/release=""
          variant/extensions_support=false
          variant/thread_support=false
          vram_texture_compression/for_desktop=false
          vram_texture_compression/for_mobile=false
          html/export_icon=false
          html/custom_html_shell=""
          html/head_include=""
          html/canvas_resize_policy=2
          html/focus_canvas_on_start=true
          html/experimental_virtual_keyboard=true
          progressive_web_app/enabled=false
          progressive_web_app/ensure_cross_origin_isolation_headers=false
          progressive_web_app/offline_page=""
          progressive_web_app/display=0
          progressive_web_app/orientation=0
          progressive_web_app/icon_144x144=""
          progressive_web_app/icon_180x180=""
          progressive_web_app/icon_512x512=""
          progressive_web_app/background_color=Color(0, 0, 0, 1)
          EOF
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path "$project_dir" --editor --import --quit
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path "$project_dir" --export-release Web "$GITHUB_WORKSPACE/site/index.html"
          test -s site/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
